{% extends 'base.html' %}
{% load i18n farm_i18n static %}
{% block title %}Pesticide Calculator · {% translate "Krishi Mitra" %}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/you-dashboard.css' %}?v={{ STATIC_VERSION }}">
{% endblock %}

{% block content %}
<div class="pesticide-calc-page py-2">
  <script id="user-crops-data" type="application/json">{{ user_crops_json|safe }}</script>
  <div id="pesticide-calculator-root" data-react-island="PesticideCalculator">
    <!-- Skeleton shaped like the calculator, replaced as soon as it loads -->
    <div class="max-w-md mx-auto p-4 sm:p-6 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl min-h-[600px]" role="status" aria-busy="true">
      <span class="visually-hidden">{% translate "Loading…" %}</span>
      <div class="sk sk-title" style="width:60%"></div>
      <div class="sk sk-line" style="width:85%;margin-bottom:22px"></div>
      <div class="sk sk-line" style="width:40%"></div>
      <div class="sk sk-input"></div>
      <div class="sk sk-line" style="width:55%"></div>
      <div class="sk sk-input"></div>
      <div class="sk sk-line" style="width:35%"></div>
      <div class="sk sk-input"></div>
      <div class="sk sk-line" style="width:50%"></div>
      <div class="sk sk-input"></div>
      <div class="sk sk-block mb-3" style="height:110px"></div>
      <div class="sk sk-button"></div>
    </div>
  </div>
</div>
{% endblock %}
