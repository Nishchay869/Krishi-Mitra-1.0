{% extends 'base.html' %}
{% load i18n farm_i18n static %}
{% block body_class %}agro-home{% endblock %}
{% block extra_head %}
<meta name="description" content="Practical farming guidance, crop recommendations, leaf health checks, forecasts, and market insights. Meet Krishi Mitra, your AI farming companion.">
<link rel="preload" as="image" href="{% static 'images/landing/farmland.jpg' %}" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{% endblock %}
{% block content %}
<div data-agro-landing data-asset-base="{% static 'images' %}"
 data-start="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}{% url 'accounts:register' %}{% endif %}"
 data-dashboard="{% url 'accounts:dashboard' %}" data-profile="{% url 'accounts:profile' %}"
 data-chat="{% url 'chatbot:chat' %}" data-crop="{% url 'crops:recommend' %}"
 data-disease="{% url 'disease:detect' %}" data-weather="{% url 'weather:forecast' %}"
 data-fertilizer="{% url 'crops:fertilizer' %}" data-market="{% url 'market:prices' %}"
 data-yield="{% url 'crops:yield' %}" data-library="{% url 'crops:library' %}">
{% include 'partials/home_fallback.html' %}
</div>
{% endblock %}
