{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate "Set a new password" %} · Krishi Mitra{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto my-4 border" style="max-width: 480px; border-radius: 16px;">
  <div class="card-body p-4">
    <p class="mb-3">{% translate "Your password has been changed. You can now log in." %}</p>
    <a class="btn-21st btn-21st-primary w-100 py-2" href="{% url 'accounts:login' %}">{% translate "Login" %}</a>
  </div>
</div>
{% endblock %}
